# LUNAS AI Service - Model Configuration
# ML Engineering: Centralized configuration for all models

models:
  # Primary: YOLOv8n trained on RDD2022 (Custom trained model)
  road_damage:
    name: "YOLOv8n Road Damage Detection (RDD2022 Trained)"
    path: "models/road/rdd/yolov8n-rdd2022-best.pt"
    type: "detection"
    classes:
      - pothole
      - alligator_crack
      - longitudinal_crack
      - transverse_crack
    confidence_threshold: 0.25
    # Candidate floor for advisory/manual review. Candidates below the
    # production threshold are never automatic decisions.
    candidate_threshold: 0.05
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "Trained on RDD2022 dataset - optimized for Philippine roads"
  
  # Environmental Hazards: Urban safety hazards
  environmental_hazards:
    name: "YOLOv8n Environmental Hazards Detection"
    path: "models/other/environmentalhazard/yolov8n-env-hazards-best.pt"
    type: "detection"
    # This broad category is not safe for automatic classification while its
    # per-hazard datasets are still being improved. Candidates may be shown
    # to an official, but this model can never produce an AI suggestion.
    manual_only: true
    classes:
      - fallen_tree
      - fire_source
      - garbage_pileup
      - open_manhole
    confidence_threshold: 0.25
    # Keep this model conservative; it remains advisory/manual review only.
    # These temporary per-class gates prevent a weak class match from being
    # presented as the leading hazard while the dataset is being improved.
    # Candidates below a class gate remain visible to reviewers.
    class_confidence_thresholds:
      fallen_tree: 0.50
      fire_source: 0.40
      garbage_pileup: 0.30
      open_manhole: 0.45
    candidate_threshold: 0.25
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "Detects environmental and urban safety hazards"

  # Electrical damage only: never include intact-pole/component labels here.
  electrical_damage:
    name: "YOLOv8n Electrical Damage Detection (fault boxes)"
    path: "models/electrical/electricpole/best.pt"
    type: "detection"
    damage_only: true
    classes:
      - surge_arrester_discoloration
      - surge_arrester_insulation_breakdown
      - surge_arrester_aging
      - surge_arrester_loose_nut
      - surge_arrester_damage
      - surge_arrester_ground_lead_missing
      - surge_arrester_detached
      - surge_arrester_ground_lead_broken
      - porcelain_insulator_crack
      - porcelain_insulator_damage
      - porcelain_insulator_flashover
      - porcelain_insulator_lead_missing
      - conductor_insulation_damage
      - conductor_strand_breakage
      - conductor_strand_loosening
      - conductor_vegetation_encroachment
      - conductor_crossarm_contact
      - composite_insulator_damage
      - high_voltage_joint_overheating
      - high_voltage_joint_damage
      - line_hardware_terminal_damage
      - line_hardware_clamp_crack
      - line_hardware_clamp_loose
      - insulator_shed_chipping
      - bird_nest_on_line
      - foreign_object_on_line
      - ground_lead_broken
      - cable_break
      - cable_thunderbolt
    confidence_threshold: 0.30
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "Damage-only boxes from Power Equipment transmission faults and Cable Damage; advisory only"

  # Surface drainage issues: visible water and blocked drainage channels only.
  surface_drainage:
    name: "YOLOv8n Surface Drainage Issue Detection"
    path: "models/drainage/surfacedrainage/best.pt"
    type: "detection"
    damage_only: true
    classes:
      - standing_water
      - blocked_surface_drain
    confidence_threshold: 0.35
    # Surface-water candidates are surfaced for manual review instead of
    # being silently discarded by the production threshold.
    candidate_threshold: 0.05
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "Public-data model for standing water and blocked surface drains; advisory/manual review only"

  # Water infrastructure damage: leak evidence only; no automatic severity or closure decisions.
  water_leak:
    name: "YOLOv8n Water Leak Detection"
    path: "models/water/waterleak/best.pt"
    type: "detection"
    damage_only: true
    classes:
      - water_leak
    confidence_threshold: 0.35
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "CC BY 4.0 public pipe-leak v6 model; advisory/manual review only"

  # Gas infrastructure damage is intentionally manual-only until image data is available.
  gas_infrastructure_damage:
    name: "Gas Infrastructure Damage Detection (manual review)"
    path: "models/gas/gasinfrastructure/best.pt"
    type: "detection"
    damage_only: true
    classes:
      - corrosion_rust
      - water_seepage
      - wall_crack
      - coating_damage
    confidence_threshold: 0.35
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "Manual-only until a licensed image-bearing gas-infrastructure damage dataset is available"

  # Streetlight damage: the source has one dedicated damaged class.
  streetlight_damage:
    name: "YOLOv8n Streetlight Damage Detection"
    path: "models/streetlight/streetlightdamage/best.pt"
    type: "detection"
    damage_only: true
    classes:
      - streetlight_damage
    confidence_threshold: 0.35
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
    notes: "CC BY 4.0 public StreetLampPole damaged-class model; advisory/manual review only"
    
  crack_segmentation:
    name: "YOLOv8n-seg Crack Segmentation"
    path: "models/yolov8n-seg-cracks.pt"
    type: "segmentation"
    classes:
      - crack
    confidence_threshold: 0.30
    iou_threshold: 0.45
    input_size: 640
    preprocessing:
      normalize: true
      resize: true
  
category_models:
  # These keys are the canonical category codes shared by the web, mobile,
  # and backend incident APIs. A null value is intentionally manual-only.
  road: road_damage
  drainage: surface_drainage
  electrical: electrical_damage
  water: water_leak
  gas: gas_infrastructure_damage
  streetlight: streetlight_damage
  other: environmental_hazards

privacy:
  # YuNet is a lightweight face detector. The backend applies visual blur
  # after receiving these normalized detection boxes.
  face_model_path: models/privacy/face_detection_yunet_2023mar.onnx
  face_model_confidence: 0.75
  face_nms_threshold: 0.3
  face_cascade: null
  # The old Haar plate cascade is intentionally no longer used.
  plate_model_path: models/privacy/license-plate.pt
  # Keep a conservative threshold for plates: low-confidence candidates in
  # this traffic scene land on bumpers/road markings rather than plates.
  plate_model_confidence: 0.10
  plate_tile_size: 640
  plate_tile_overlap: 0.2
  plate_cascade: null
  face_min_neighbors: 5
  plate_min_neighbors: 7
  # Multiple upscaled passes improve recall for distant faces and plates.
  # Redaction remains backend-owned; these values do not read plate text.
  face_upscale_factors: [1.0, 1.5, 2.0]
  plate_upscale_factors: [1.0, 1.5, 2.0]
  max_detection_dimension: 1600

severity_estimation:
  pothole:
    minor: 0.05      # < 5% of image area
    moderate: 0.10   # 5-10% of image area
    severe: 0.15     # > 10% of image area
  crack:
    minor: 0.03
    moderate: 0.08
    severe: 0.15

device:
  auto_detect: true
  preference:
    - mps      # Apple M1/M2 GPU
    - cuda     # NVIDIA GPU
    - cpu      # Fallback

inference:
  batch_size: 1
  half_precision: false  # FP16 (GPU only)
  augment: false         # TTA (slower but more accurate)
  max_det: 50           # Max detections per image
  agnostic_nms: false   # Class-agnostic NMS

training:
  dataset: "rdd2022"
  epochs: 100
  batch_size: 16
  image_size: 640
  optimizer: "AdamW"
  learning_rate: 0.001
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 50
  save_period: 10
  pretrained: true
  freeze: 0  # Freeze first N layers
  
  # RDD2022-specific optimizations
  # Based on research: best settings for road damage detection
  augmentation:
    hsv_h: 0.015      # Hue variation (minimal - roads don't change color much)
    hsv_s: 0.7        # Saturation (higher - handle different lighting)
    hsv_v: 0.4        # Value/brightness (moderate)
    degrees: 0.0      # No rotation (roads are horizontal)
    translate: 0.1    # Slight translation
    scale: 0.5        # Scale variation
    shear: 0.0        # No shearing
    perspective: 0.0  # No perspective transform
    flipud: 0.0       # No vertical flip
    fliplr: 0.5       # 50% horizontal flip (important for roads)
    mosaic: 1.0       # Mosaic augmentation (very important)
    mixup: 0.0        # No mixup (not good for detection)
    copy_paste: 0.0   # No copy-paste

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/lunas_ai.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
