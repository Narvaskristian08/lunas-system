<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
        }
        .material-symbols-outlined {

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }

        }

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl animate-float"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>
</div>
<!-- Main Content Wrapper -->
<main class="flex-grow flex items-center justify-center px-container_padding z-10 py-xl">
<div class="w-full max-w-md space-y-lg">
<!-- Branding/Identity -->
<div class="flex flex-col items-center text-center space-y-sm">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-md">
<span class="material-symbols-outlined text-on-primary text-[32px]">grid_view</span>
</div>
<h1 class="font-display text-display text-on-surface">Welcome Back</h1>
<p class="font-body text-body text-on-surface-variant">Sign in to manage your city assets and utility infrastructure.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-lg rounded-[28px] shadow-sm border border-outline-variant/30">
<form class="space-y-md" id="loginForm">
<!-- Identifier Field (Email or Mobile) -->
<div class="relative">
<div class="flex items-center bg-surface-variant/30 rounded-t-xl px-md pt-6 pb-2 border-b border-outline focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-md">person</span>
<div class="flex-grow">
<label class="absolute top-2 left-12 text-caption text-on-surface-variant font-caption" for="identifier">Email or Mobile Number</label>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-body font-body placeholder:text-outline-variant" id="identifier" name="identifier" placeholder="name@agency.gov" required="" type="text"/>
</div>
</div>
</div>
<!-- Password Field -->
<div class="relative">
<div class="flex items-center bg-surface-variant/30 rounded-t-xl px-md pt-6 pb-2 border-b border-outline focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-md">lock</span>
<div class="flex-grow">
<label class="absolute top-2 left-12 text-caption text-on-surface-variant font-caption" for="password">Password</label>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-body font-body placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="ml-sm text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between py-xs">
<label class="flex items-center cursor-pointer group">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary/20 transition-all" type="checkbox"/>
<span class="ml-sm font-body text-body text-on-surface-variant group-hover:text-on-surface">Remember Me</span>
</label>
<a class="font-button text-button text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Action Button -->
<div class="pt-sm">
<button class="w-full py-md px-lg bg-primary text-on-primary font-button text-button rounded-xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-md text-caption text-outline font-caption uppercase tracking-wider">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center py-sm px-md border border-outline-variant rounded-xl font-button text-body hover:bg-surface-variant/20 transition-all">

<span>Agency SSO</span>
</button>
<button class="flex items-center justify-center py-sm px-md border border-outline-variant rounded-xl font-button text-body hover:bg-surface-variant/20 transition-all">
<span class="material-symbols-outlined mr-sm text-on-surface-variant">passkey</span>
<span>Passkey</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="text-center pt-md">
<p class="font-body text-body text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-button hover:underline underline-offset-4 ml-xs" href="#">Create Account</a>
</p>
</div>

<footer class="p-lg text-center z-10">
<p class="font-caption text-caption text-outline">
            © 2024 LUNAS Utility Management System. Proprietary and Confidential.
        </p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Form Submission Micro-interaction
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
                
                // Redirect logic would go here
            }, 1500);
        });
    </script>
