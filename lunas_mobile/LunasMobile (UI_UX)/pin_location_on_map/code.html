<style>
        .map-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Full viewport height */
            overflow: hidden;
        }
        
        /* Map pattern overlay */
        .map-pattern {
            background-color: #f0f3ff; /* surface-container-low */
            background-image: radial-gradient(#c2c6d4 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Draggable Pin Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .pin-shadow {
            width: 16px;
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(2px);
            transition: all 0.3s ease;
        }
        
        .pin-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: grab;
        }
        
        .pin-wrapper:active {
            cursor: grabbing;
        }

        .pin-wrapper:active .pin-icon {
            transform: translateY(-15px) scale(1.1);
        }
        
        .pin-wrapper:active .pin-shadow {
            transform: translateX(-50%) scale(0.6);
            opacity: 0.5;
        }
        
        .pin-icon {
            color: #ba1a1a; /* error color for pin */
            font-size: 48px !important;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Glassmorphism for floating panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Safe area padding for mobile */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    </style>

<script>
        // Simple drag simulation for the pin
        const pin = document.getElementById('draggablePin');
        const mapCanvas = document.getElementById('mapCanvas');
        
        let isDragging = false;

        pin.addEventListener('mousedown', () => isDragging = true);
        pin.addEventListener('touchstart', () => isDragging = true, {passive: true});

        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('touchend', () => isDragging = false);

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // In a real app, this would update coordinates and pan the map
            // Here we just prevent default text selection while dragging
            e.preventDefault(); 
        });
        
        // Add subtle pan effect to map background based on mouse movement
        document.addEventListener('mousemove', (e) => {
            if(isDragging) return;
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            mapCanvas.style.backgroundPosition = `${x * 10}px ${y * 10}px`;
        });
    </script>
