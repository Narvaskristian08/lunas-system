version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: lunas_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: lunas_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lunas_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./lunas_backend
      dockerfile: Dockerfile
    container_name: lunas_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/lunas_db?authSource=admin
      
      # JWT (load from .env)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRE: 30d

      # Web login CAPTCHA
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-localhost,127.0.0.1,dummy-key-response}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-8000}

      # Mobile registration email MFA
      REGISTRATION_MFA_SECRET: ${REGISTRATION_MFA_SECRET}
      REGISTRATION_MFA_EXPIRE_MINUTES: ${REGISTRATION_MFA_EXPIRE_MINUTES:-10}
      REGISTRATION_MFA_RESEND_SECONDS: ${REGISTRATION_MFA_RESEND_SECONDS:-60}
      REGISTRATION_MFA_DELIVERY_URL: ${REGISTRATION_MFA_DELIVERY_URL}
      REGISTRATION_MFA_DELIVERY_TOKEN: ${REGISTRATION_MFA_DELIVERY_TOKEN}
      REGISTRATION_MFA_DELIVERY_TIMEOUT_MS: ${REGISTRATION_MFA_DELIVERY_TIMEOUT_MS:-10000}
      REGISTRATION_MFA_EXPOSE_CODE: ${REGISTRATION_MFA_EXPOSE_CODE:-false}
      
      # Supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-lunas-storage}
      
      # OneSignal
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY}
      ONESIGNAL_USER_AUTH_KEY: ${ONESIGNAL_USER_AUTH_KEY}
      
      # Google Maps
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      
      # SLA
      SLA_CRITICAL: 48
      SLA_HIGH: 72
      SLA_MEDIUM: 168
      SLA_LOW: 336
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # File Upload
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: image/jpeg,image/png,image/jpg
      
      # AI Service
      AI_SERVICE_URL: http://lunas-ai:5001
      AI_SERVICE_TIMEOUT: 30000
      AI_SERVICE_ENABLED: true
      AI_EVIDENCE_ANALYSIS_ENABLED: true
      
      # CORS - Allow web frontend
      CORS_ORIGIN: http://localhost:3000,http://web:3000
    volumes:
      - ./lunas_backend/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Dashboard (Next.js)
  web:
    build:
      context: ./lunas_web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: lunas_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Service (Python/YOLO)
  lunas-ai:
    build:
      context: ./lunas_ai
      dockerfile: Dockerfile
    container_name: lunas_ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      DEBUG: "False"
      
      # Device configuration
      DEVICE: cpu  # Change to 'cuda' if GPU available
      ENABLE_HALF_PRECISION: "False"
      
      # Detection thresholds
      CONFIDENCE_THRESHOLD: 0.25
      IOU_THRESHOLD: 0.45
      MAX_DETECTIONS: 50
      
      # Image processing
      MAX_IMAGE_SIZE: 1920
      IMAGE_QUALITY: 85
      
      # Logging
      LOG_LEVEL: INFO
      
      # CORS - Allow backend access
      ALLOWED_ORIGINS: http://localhost:5000,http://backend:5000
    volumes:
      - ./lunas_ai/models:/app/models
      - ./lunas_ai/logs:/app/logs
      - ./lunas_ai/cache:/app/cache
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MongoDB Express (Optional - Database UI)
  mongo-express:
    image: mongo-express:latest
    container_name: lunas_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - lunas_network
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  lunas_network:
    driver: bridge
