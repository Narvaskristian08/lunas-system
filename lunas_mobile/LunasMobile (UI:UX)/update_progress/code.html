<body class="bg-background text-on-background min-h-screen flex flex-col pb-20 md:pb-0">
<!-- TopAppBar -->

<div class="flex items-center gap-md">

<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title text-title text-on-surface">Update Progress</h1>
</div>
<div class="flex items-center">
<img alt="Repair Personnel Profile" class="w-8 h-8 rounded-full object-cover border border-outline-variant" data-alt="A small, circular avatar portrait of a construction worker wearing a hard hat, smiling slightly against a plain light blue background. High-key lighting, modern corporate style, conveying trust and reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzTdo281X-aq1wuTC0ZIHXQkY17EX_jOsznU0ETpjpufdcaKh8bIDgl9BvK12N2YDbsRgw2QO7_l5UNiJlXAumyn_Bk8k3gOGROz-_C_Yb3_ynpJSZkN9r5OMsZ5RZ6mTkzTpM00hKyPyQWx1kW7jla-ksz0wux1NnaCT5XGdi51IokpPmFHwxZySzNW-9oiM5Fl4Mr1uNGHaDuDRNYqIQ6jH8iP6n4jQwAY9Xwk4BKxpTNRL1FboroEwk0oHrudQrBq2vFV16-N30"/>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-container_padding py-lg max-w-3xl mx-auto w-full flex flex-col gap-lg">
<!-- Header Info -->
<div class="flex flex-col gap-xs">
<h2 class="font-heading text-heading text-on-surface">WO-2023-8842</h2>
<p class="font-body text-body text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">location_on</span>
                1420 Downtown Ave, Main Intersection
            </p>
</div>
<!-- Radial Progress & Timer Card -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant flex flex-col sm:flex-row items-center justify-between gap-md relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -right-12 -top-12 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<div class="flex items-center gap-lg w-full sm:w-auto z-10">
<!-- Radial Progress -->
<div class="relative w-24 h-24 flex-shrink-0">
<svg class="w-full h-full" viewbox="0 0 100 100">
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-primary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="40" stroke-dasharray="251.2" stroke-dashoffset="87.92" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center flex-col">
<span class="font-title text-title text-primary">65%</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<h3 class="font-subtitle text-subtitle text-on-surface">Current Completion</h3>
<p class="font-body text-body text-on-surface-variant">Last updated 10 mins ago</p>
</div>
</div>
<!-- Estimated Time -->
<div class="bg-surface-container rounded-lg p-sm flex items-center gap-sm border border-outline-variant/50 w-full sm:w-auto z-10">
<div class="bg-primary-container text-on-primary-container p-xs rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">timer</span>
</div>
<div class="flex flex-col">
<span class="font-caption text-caption text-on-surface-variant">Est. Remaining Time</span>
<span class="font-button text-button text-on-surface">45 mins</span>
</div>
</div>
</section>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Repair Status Dropdown -->
<div class="flex flex-col gap-xs relative">
<label class="font-body text-body text-on-surface" for="repair_status">Repair Status</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">construction</span>
</div>
<select class="w-full bg-surface-container-lowest border-0 rounded-t-[14px] border-b border-outline pl-[40px] pr-md py-sm font-body text-body text-on-surface focus:ring-0 focus:border-primary focus:border-b-2 appearance-none" id="repair_status" name="repair_status">
<option value="excavation">Excavation &amp; Clearing</option>
<option selected="" value="base_layer">Resurfacing Base Layer</option>
<option value="pouring">Pouring Asphalt</option>
<option value="curing">Curing &amp; Cooling</option>
<option value="final_inspection">Final Inspection</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Progress Notes Multiline Text Field -->
<div class="flex flex-col gap-xs">
<label class="font-body text-body text-on-surface" for="progress_notes">Progress Notes</label>
<div class="relative">
<div class="absolute top-sm left-sm flex items-start pointer-events-none">
<span class="material-symbols-outlined text-outline">edit_note</span>
</div>
<textarea class="w-full bg-surface-container-lowest border-0 rounded-t-[14px] border-b border-outline pl-[40px] pr-md py-sm font-body text-body text-on-surface focus:ring-0 focus:border-primary focus:border-b-2 resize-none" id="progress_notes" name="progress_notes" placeholder="Enter details about current progress..." rows="4"></textarea>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1 text-right">0 / 500</p>
</div>
<!-- Upload Photo Button -->
<div class="flex flex-col gap-sm">
<span class="font-body text-body text-on-surface">Visual Evidence</span>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-sm">
<!-- Existing Photo -->
<div class="relative rounded-lg overflow-hidden border border-outline-variant h-24 group">
<img alt="Base layer photo" class="w-full h-full object-cover" data-alt="A close-up shot of a freshly poured layer of asphalt in a rectangular road cutout. The asphalt is dark, textured, and slightly steaming. Bright daylight illumination highlights the texture. Surrounding pavement is light gray. Modern documentary style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyAJrrjPOdC3WAuJcp6YtGOJK-T0RYWBZoHCYLCXU8tmqLpT_ps2PNdcDPBca7fTe_4w9pDymTSOT3xBcpblfgg7l0GLOmUpmvPL4UIcTfM073uqCXY5RxcLJFTqL9hgHN5GBoBR58_vFuYk4ZQC3UkBn-DDlmwYBjvr_EM-OJ_Lt1kMBh1gRrjT9cPgYTQuuJJ3pcnb0tymxPuEsA5l37-4REZs3fzhs-0W9hTs7QD7cS8IlXKszugs7fn-wki20uctFXumwlMFh0"/>
<button class="absolute top-1 right-1 bg-surface/80 p-1 rounded-full text-on-surface opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Upload Button -->
<button class="flex flex-col items-center justify-center h-24 rounded-lg border-2 border-dashed border-outline-variant bg-surface-container-lowest hover:bg-surface-container transition-colors text-primary gap-xs" type="button">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="font-caption text-caption">Upload Photo</span>
</button>
</div>
</div>
<hr class="border-outline-variant/50 my-md"/>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row-reverse gap-sm w-full">
<button class="bg-primary text-on-primary font-button text-button rounded-[14px] px-lg py-sm flex-1 flex items-center justify-center gap-xs hover:bg-primary/90 transition-colors shadow-sm active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Progress
                </button>
<button class="bg-surface-container-high text-on-surface font-button text-button rounded-[14px] px-lg py-sm flex-1 flex items-center justify-center gap-xs hover:bg-surface-container-highest transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[18px]">play_arrow</span>
                    Mark as In Progress
                </button>
</div>
</form>
</main>
<!-- BottomNavBar (Hidden on md and up, typical for focused transactional screens, but instructed to consider navigation shell logic. Since this is an 'Update Progress' screen, it falls under the "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action" category and should technically have the shell suppressed. The prompt mentions a 'Close' or 'Back' action implies temporary departure. Therefore, the bottom nav is suppressed for this focused task screen.) -->
<script>
        // Simple character counter
        const textarea = document.getElementById('progress_notes');
        const counter = textarea.nextElementSibling;
        
        textarea.addEventListener('input', function() {
            const length = this.value.length;
            counter.textContent = `${length} / 500`;
            if (length > 500) {
                counter.classList.add('text-error');
            } else {
                counter.classList.remove('text-error');
            }
        });
    </script>
</body></html>
