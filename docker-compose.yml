services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the root .env file}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the root .env file}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-lunas_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lunas_network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./lunas_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-lunas_db}?authSource=admin"
      
      # JWT (load from .env)
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a distinct JWT_REFRESH_SECRET of at least 32 characters}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      MAX_REFRESH_TOKENS_PER_USER: ${MAX_REFRESH_TOKENS_PER_USER:-5}

      # Web login CAPTCHA
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY (dummy key only for local QA)}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:?Set the exact permitted web hostnames}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-8000}

      # Mobile registration email MFA
      REGISTRATION_MFA_SECRET: ${REGISTRATION_MFA_SECRET}
      REGISTRATION_MFA_EXPIRE_MINUTES: ${REGISTRATION_MFA_EXPIRE_MINUTES:-10}
      REGISTRATION_MFA_RESEND_SECONDS: ${REGISTRATION_MFA_RESEND_SECONDS:-60}
      REGISTRATION_MFA_DELIVERY_URL: ${REGISTRATION_MFA_DELIVERY_URL}
      REGISTRATION_MFA_DELIVERY_TOKEN: ${REGISTRATION_MFA_DELIVERY_TOKEN}
      REGISTRATION_MFA_DELIVERY_TIMEOUT_MS: ${REGISTRATION_MFA_DELIVERY_TIMEOUT_MS:-10000}
      REGISTRATION_MFA_EXPOSE_CODE: ${REGISTRATION_MFA_EXPOSE_CODE:-false}

      # Transactional email. Resend takes precedence when EMAIL_PROVIDER=resend;
      # the existing webhook variables remain available for local QA.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-webhook}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      EMAIL_FROM: ${EMAIL_FROM}
      ACCOUNT_ACTIVATION_APP_URL: ${ACCOUNT_ACTIVATION_APP_URL:-http://localhost:3000/activate-account}
      ACCOUNT_ACTIVATION_DELIVERY_URL: ${ACCOUNT_ACTIVATION_DELIVERY_URL}
      ACCOUNT_ACTIVATION_DELIVERY_TOKEN: ${ACCOUNT_ACTIVATION_DELIVERY_TOKEN}
      ACCOUNT_ACTIVATION_DELIVERY_TIMEOUT_MS: ${ACCOUNT_ACTIVATION_DELIVERY_TIMEOUT_MS:-10000}
      ACCOUNT_ACTIVATION_EXPIRE_MINUTES: ${ACCOUNT_ACTIVATION_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_APP_URL: ${PASSWORD_RESET_APP_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_DELIVERY_URL: ${PASSWORD_RESET_DELIVERY_URL}
      PASSWORD_RESET_DELIVERY_TOKEN: ${PASSWORD_RESET_DELIVERY_TOKEN}
      PASSWORD_RESET_DELIVERY_TIMEOUT_MS: ${PASSWORD_RESET_DELIVERY_TIMEOUT_MS:-10000}
      
      # AWS S3 evidence storage. Local Compose requires AWS credentials or an
      # S3-compatible endpoint; production EC2 uses the instance role instead.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_EVIDENCE_BUCKET: ${S3_EVIDENCE_BUCKET:?Set S3_EVIDENCE_BUCKET}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_ENDPOINT: ${S3_ENDPOINT}
      EVIDENCE_SIGNED_URL_EXPIRE_SECONDS: ${EVIDENCE_SIGNED_URL_EXPIRE_SECONDS:-3600}
      SUPABASE_MIGRATION_READ_ENABLED: ${SUPABASE_MIGRATION_READ_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-lunas-storage}
      
      # OneSignal
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY}
      ONESIGNAL_USER_AUTH_KEY: ${ONESIGNAL_USER_AUTH_KEY}
      
      # Google Maps
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      
      # SLA
      SLA_AUTOMATION_ENABLED: ${SLA_AUTOMATION_ENABLED:-true}
      SLA_POLL_INTERVAL_MINUTES: ${SLA_POLL_INTERVAL_MINUTES:-5}
      SLA_APPROACHING_THRESHOLD_HOURS: 24
      SLA_CRITICAL: 48
      SLA_HIGH: 72
      SLA_MEDIUM: 168
      SLA_LOW: 336
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      
      # File Upload
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/jpg,image/webp}
      
      # AI Service
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://lunas-ai:5001}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-30000}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-false}
      AI_EVIDENCE_ANALYSIS_ENABLED: ${AI_EVIDENCE_ANALYSIS_ENABLED:-false}
      PRIVACY_REDACTION_ENABLED: ${PRIVACY_REDACTION_ENABLED:-false}
      
      # CORS - Allow web frontend
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the comma-separated public web origins}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Dashboard (Next.js)
  web:
    build:
      context: ./lunas_web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set the public Turnstile site key}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LUNAS_API_URL: http://backend:5000/api/v1
      LUNAS_SESSION_SECRET: ${LUNAS_SESSION_SECRET:?Set a unique LUNAS_SESSION_SECRET of at least 32 characters}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set the public Turnstile site key}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Service (Python/YOLO)
  lunas-ai:
    build:
      context: ./lunas_ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      DEBUG: "False"
      
      # Device configuration
      DEVICE: cpu  # Change to 'cuda' if GPU available
      ENABLE_HALF_PRECISION: "False"
      
      # Detection thresholds
      CONFIDENCE_THRESHOLD: 0.25
      IOU_THRESHOLD: 0.45
      MAX_DETECTIONS: 50
      
      # Image processing
      MAX_IMAGE_SIZE: 1920
      IMAGE_QUALITY: 85
      
      # Logging
      LOG_LEVEL: INFO
      
      # CORS - Allow backend access
      ALLOWED_ORIGINS: http://backend:5000
    volumes:
      - ai_logs:/app/logs
      - ai_cache:/app/cache
    networks:
      - lunas_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MongoDB Express (Optional - Database UI)
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-lunas-local-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-change-this-local-password}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lunas_network
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_logs:
    driver: local
  ai_logs:
    driver: local
  ai_cache:
    driver: local

networks:
  lunas_network:
    driver: bridge
