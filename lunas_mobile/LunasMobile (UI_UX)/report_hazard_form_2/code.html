<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Incident - UrbanGuard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#f0f3ff",
                      "on-primary-fixed": "#001b3d",
                      "on-surface": "#111c2d",
                      "surface": "#f9f9ff",
                      "on-error": "#ffffff",
                      "surface-bright": "#f9f9ff",
                      "primary-container": "#1565c0",
                      "background": "#f9f9ff",
                      "outline-variant": "#c2c6d4",
                      "secondary-fixed": "#a3f69c",
                      "inverse-surface": "#263143",
                      "inverse-on-surface": "#ecf1ff",
                      "secondary-container": "#a0f399",
                      "on-primary-container": "#dae5ff",
                      "on-secondary-fixed-variant": "#005312",
                      "on-tertiary-fixed": "#2a1800",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#8e5b00",
                      "surface-tint": "#005db7",
                      "on-tertiary-fixed-variant": "#643f00",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#217128",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#00468c",
                      "error": "#ba1a1a",
                      "tertiary-fixed-dim": "#ffb957",
                      "secondary-fixed-dim": "#88d982",
                      "outline": "#727783",
                      "on-secondary-fixed": "#002204",
                      "on-primary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed-dim": "#a9c7ff",
                      "primary": "#004d99",
                      "tertiary-fixed": "#ffddb5",
                      "surface-container": "#e7eeff",
                      "surface-dim": "#cfdaf2",
                      "tertiary": "#6d4500",
                      "surface-container-high": "#dee8ff",
                      "on-tertiary-container": "#ffe0bb",
                      "surface-variant": "#d8e3fb",
                      "primary-fixed": "#d6e3ff",
                      "on-surface-variant": "#424752",
                      "secondary": "#1b6d24",
                      "surface-container-highest": "#d8e3fb",
                      "on-secondary": "#ffffff",
                      "inverse-primary": "#a9c7ff",
                      "on-background": "#111c2d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "md": "16px",
                      "sm": "8px",
                      "xs": "4px",
                      "lg": "24px",
                      "container_padding": "16px",
                      "gutter": "12px",
                      "base": "8px"
              },
              "fontFamily": {
                      "body": [
                              "Inter"
                      ],
                      "title": [
                              "Inter"
                      ],
                      "subtitle": [
                              "Inter"
                      ],
                      "display": [
                              "Inter"
                      ],
                      "heading": [
                              "Inter"
                      ],
                      "caption": [
                              "Inter"
                      ],
                      "button": [

                      ]
              },
              "fontSize": {
                      "body": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "title": [

                      "subtitle": [

                      ],
                      "display": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "heading": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ],
                      "caption": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "400"
                              }
                      ],
                      "button": [
                              "15px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.01em",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen">
<!-- Top App Bar (Task-Focused: Minimal) -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm h-16 px-md flex items-center justify-between">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<span class="font-title text-title text-on-surface">Report Incident</span>
</div>
<button class="text-primary font-button text-button">Help</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-[88px] pb-xl px-md max-w-2xl mx-auto space-y-lg">
<!-- Progress Indicator -->
<div class="flex items-center justify-between text-caption font-caption text-on-surface-variant mb-md">
<span>Step 1 of 3: Details</span>
<div class="flex gap-1">
<div class="h-1 w-8 bg-primary rounded-full"></div>
<div class="h-1 w-8 bg-surface-variant rounded-full"></div>
<div class="h-1 w-8 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Image Upload Section -->
<section class="space-y-sm">
<h2 class="font-subtitle text-subtitle text-on-surface">Photo Evidence</h2>
<div class="w-full h-48 border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low flex flex-col items-center justify-center text-center cursor-pointer hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-4xl text-outline mb-sm">add_a_photo</span>
<p class="font-body text-body text-on-surface-variant mb-xs">Tap to take photo or upload</p>
<p class="font-caption text-caption text-outline">AI analysis will automatically detect hazards</p>
</div>
<!-- AI Preview Empty State -->
<div class="bg-surface-variant rounded-lg p-sm flex items-start gap-sm mt-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
<div>
<p class="font-subtitle text-subtitle text-on-surface text-sm">AI Hazard Detection</p>
<p class="font-caption text-caption text-on-surface-variant">Upload an image to identify severity and category automatically.</p>
</div>
</div>
</section>
<!-- Details Form -->
<form class="space-y-lg">
<!-- Category Dropdown -->
<div class="space-y-xs">
<label class="block font-subtitle text-subtitle text-on-surface" for="category">Hazard Category</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">category</span>
</div>
<select class="w-full pl-xl pr-sm py-sm bg-surface-container-low border-b-2 border-surface-variant rounded-t-[14px] focus:border-primary focus:ring-0 text-on-surface font-body text-body appearance-none" id="category">
<option disabled="" selected="" value="">Select category...</option>
<option value="road">Road</option>
<option value="water">Water</option>
<option value="electricity">Electricity</option>
<option value="drainage">Drainage</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Severity Selector -->
<div class="space-y-sm">
<label class="block font-subtitle text-subtitle text-on-surface">Severity Level</label>
<div class="grid grid-cols-3 gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="low"/>
<div class="text-center py-sm border border-outline-variant rounded-lg font-button text-button text-on-surface peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-colors">
                            Low
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="medium"/>
<div class="text-center py-sm border border-outline-variant rounded-lg font-button text-button text-on-surface peer-checked:bg-tertiary-fixed peer-checked:text-on-tertiary-fixed peer-checked:border-tertiary-container transition-colors">
                            Medium
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="high"/>
<div class="text-center py-sm border border-outline-variant rounded-lg font-button text-button text-on-surface peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:border-error transition-colors">
                            High
                        </div>
</label>
</div>
</div>
<!-- Description Textbox -->
<div class="space-y-xs">
<label class="block font-subtitle text-subtitle text-on-surface" for="description">Description</label>
<div class="relative">
<div class="absolute top-sm left-sm pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">description</span>
</div>
<textarea class="w-full pl-xl pr-sm py-sm bg-surface-container-low border-b-2 border-surface-variant rounded-t-[14px] focus:border-primary focus:ring-0 text-on-surface font-body text-body resize-none" id="description" placeholder="Provide additional details about the incident..." rows="4"></textarea>
</div>
</div>
<!-- Bottom Action -->
<div class="pt-md pb-safe">
<button class="w-full bg-primary text-on-primary font-button text-button py-sm rounded-[14px] shadow-sm hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]" type="button">
                    Continue to Location
                </button>
</div>
</form>
</main>
</body></html>
