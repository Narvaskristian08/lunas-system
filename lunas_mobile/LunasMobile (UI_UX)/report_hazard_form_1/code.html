<style>
        .md3-input {
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border: none;
            border-bottom: 1px solid #727783; /* outline color */
            background-color: #f0f3ff; /* surface-container-low */
            transition: border-bottom-color 0.2s, box-shadow 0.2s;
        }
        .md3-input:focus {
            outline: none;
            border-bottom: 2px solid #004d99; /* primary */
            box-shadow: none;
        }
        .md3-input-container {
            position: relative;
        }
        .md3-input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #424752; /* on-surface-variant */
        }
        .md3-input-with-icon {
            padding-left: 48px;
        }
        
        /* Hide bottom nav on this transactional page */
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm w-full top-0 sticky z-40 flex justify-between items-center px-md py-sm w-full">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-heading text-heading text-primary font-bold tracking-tight">Report Hazard</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow flex flex-col items-center py-lg px-container_padding">
<div class="w-full max-w-md space-y-lg">
<!-- Step 1: Photo Upload -->
<section class="space-y-sm">
<h2 class="font-subtitle text-subtitle text-on-surface">1. Evidence</h2>
<div class="w-full h-48 bg-surface-container-low border border-outline-variant border-dashed rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-4xl text-primary mb-2" data-icon="add_a_photo">add_a_photo</span>
<span class="font-button text-button text-primary">Add Photo of Hazard</span>
</div>
</section>
<!-- Step 2: Category Selection -->
<section class="space-y-sm">
<h2 class="font-subtitle text-subtitle text-on-surface">2. Category</h2>
<div class="grid grid-cols-2 gap-sm">
<button class="bg-surface-container border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-3xl group-hover:text-on-primary-container text-on-surface-variant" data-icon="add_road">add_road</span>
<span class="font-button text-button text-on-surface group-hover:text-on-primary-container">Road</span>
</button>
<button class="bg-surface-container border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-3xl group-hover:text-on-primary-container text-on-surface-variant" data-icon="water_drop">water_drop</span>
<span class="font-button text-button text-on-surface group-hover:text-on-primary-container">Water</span>
</button>
<button class="bg-surface-container border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-3xl group-hover:text-on-primary-container text-on-surface-variant" data-icon="electric_bolt">electric_bolt</span>
<span class="font-button text-button text-on-surface group-hover:text-on-primary-container">Electricity</span>
</button>
<button class="bg-surface-container border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-3xl group-hover:text-on-primary-container text-on-surface-variant" data-icon="plumbing">plumbing</span>
<span class="font-button text-button text-on-surface group-hover:text-on-primary-container">Drainage</span>
</button>
</div>
</section>
<!-- Step 3: Location -->
<section class="space-y-sm">
<h2 class="font-subtitle text-subtitle text-on-surface">3. Location</h2>
<div class="bg-surface-container rounded-xl overflow-hidden shadow-sm">
<div class="h-32 bg-surface-variant relative">
<div class="bg-cover bg-center w-full h-full opacity-70" data-alt="A clean, minimalist map interface in light mode, showing a city grid with subtle gray lines on a very light blue background. The map centers on a stylized red location pin marker indicating an incident report." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC-mte1iQxHt3MQupuulrl8iadnPNNdVCwva4IcZwjal1vtTgVau6MuGr0IDU96M-bs6MEDLRGW6WXDssVpr6aoNaCp4YJcYsBCu_qIM3mc3pWK3VjNUtJd0MYEhCM5BXqbRL3lM7L99aVK9Ghwfen4Uvz1J8wiX17CfytIHSbP8ScDpaceRSK2JT0UhSdWKAbWFuYV2wcoEqbprjiE_HiB3IvJ7AMYa7D7UuKRufgCo2AO3VdNB8VKVGJbN4jzFNsYVK-ufPRZZl2p')"></div>
<button class="absolute bottom-2 right-2 bg-primary text-on-primary rounded-full p-2 shadow-sm hover:bg-surface-tint active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
<div class="p-md bg-surface-container-low">
<div class="md3-input-container">
<span class="material-symbols-outlined md3-input-icon" data-icon="location_on">location_on</span>
<input class="md3-input w-full p-md md3-input-with-icon font-body text-body text-on-surface placeholder:text-on-surface-variant/60" placeholder="Enter address or cross street" type="text"/>
</div>
</div>
</div>
</section>
<!-- Step 4: Description -->
<section class="space-y-sm">
<h2 class="font-subtitle text-subtitle text-on-surface">4. Details</h2>
<div class="md3-input-container">
<textarea class="md3-input w-full p-md font-body text-body text-on-surface placeholder:text-on-surface-variant/60 resize-none" placeholder="Describe the issue in detail..." rows="4"></textarea>
</div>
</section>
<!-- Footer Action -->
<div class="pt-lg pb-xl">
<button class="w-full bg-primary text-on-primary font-button text-button py-md rounded-[14px] shadow-sm hover:bg-surface-tint transition-colors active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="send">send</span>
                    Submit Report
                </button>
</div>
</div>
</main>
</body></html>
