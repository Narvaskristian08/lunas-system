<style>
        .success-animation {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        
        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container_padding font-body">
<!-- Transactional Screen - Navigation Suppressed -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg p-lg md:p-xl flex flex-col items-center text-center relative overflow-hidden">
<!-- Decorative subtle background blob -->
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container rounded-bl-full opacity-30 mix-blend-multiply blur-xl pointer-events-none"></div>
<!-- Success Icon -->
<div class="success-animation relative w-24 h-24 mb-lg flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-container rounded-full opacity-20"></div>
<div class="absolute inset-2 bg-secondary-container rounded-full opacity-40"></div>
<div class="relative bg-secondary text-on-secondary rounded-full w-16 h-16 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[40px] font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Headline -->
<h1 class="fade-in-up delay-1 font-heading text-heading text-on-surface mb-sm">
            Repair Submitted Successfully
        </h1>
<!-- Supporting Text -->
<p class="fade-in-up delay-1 font-body text-body text-on-surface-variant mb-xl px-4">
            Work Order <span class="font-subtitle text-subtitle text-primary">#WO-2023-892</span> is now pending official verification. You will receive notifications as its status updates.
        </p>
<!-- Status Card (Level 1 Elevation) -->
<div class="fade-in-up delay-2 w-full bg-surface-container rounded-lg p-md mb-xl flex items-center shadow-sm border-l-4 border-secondary">
<div class="w-10 h-10 bg-surface-container-high rounded-full flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
</div>
<div class="text-left flex-1">
<div class="font-subtitle text-subtitle text-on-surface">Current Status</div>
<div class="font-caption text-caption text-on-surface-variant">Pending Verification</div>
</div>
<div class="bg-secondary-container text-on-secondary-container font-caption text-caption px-3 py-1 rounded-full">
                 Just now
             </div>
</div>
<!-- Actions -->
<div class="fade-in-up delay-2 w-full flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary font-button text-button py-3 px-6 rounded-[14px] shadow-sm hover:bg-primary/90 transition-colors active:scale-[0.98] flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[20px]">visibility</span>
                View Submitted Repair
            </button>
<button class="w-full bg-surface-variant text-primary font-button text-button py-3 px-6 rounded-[14px] shadow-sm hover:bg-surface-variant/80 transition-colors active:scale-[0.98] flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[20px]">dashboard</span>
                Return to Dashboard
            </button>
