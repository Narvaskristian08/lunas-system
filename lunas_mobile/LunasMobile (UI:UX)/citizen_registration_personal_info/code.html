<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Citizen Registration - LUNAS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-container": "#dae5ff",
                        "on-primary-fixed-variant": "#00468c",
                        "error": "#ba1a1a",
                        "surface-container": "#e7eeff",
                        "inverse-surface": "#263143",
                        "tertiary": "#6d4500",
                        "surface-bright": "#f9f9ff",
                        "surface-dim": "#cfdaf2",
                        "on-error": "#ffffff",
                        "background": "#f9f9ff",
                        "secondary-container": "#a0f399",
                        "on-secondary-fixed": "#002204",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#643f00",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c2c6d4",
                        "on-primary-fixed": "#001b3d",
                        "inverse-on-surface": "#ecf1ff",
                        "surface-variant": "#d8e3fb",
                        "tertiary-fixed-dim": "#ffb957",

                        "on-secondary-fixed-variant": "#005312",

                        "on-tertiary-container": "#ffe0bb",

                        "on-surface": "#111c2d",

                        "surface-container-low": "#f0f3ff",
                        "primary-fixed": "#d6e3ff",
                        "on-background": "#111c2d",
                        "outline": "#727783",
                        "on-tertiary": "#ffffff",
                        "secondary": "#1b6d24",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dee8ff",
                        "primary-container": "#1565c0",
                        "tertiary-container": "#8e5b00",
                        "surface-tint": "#005db7",
                        "surface-container-highest": "#d8e3fb",
                        "on-surface-variant": "#424752"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "xl": "32px",
                        "container_padding": "16px",
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "12px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "subtitle": ["Inter"],
                        "body": ["Inter"],
                        "display": ["Inter"],
                        "title": ["Inter"],
                        "heading": ["Inter"],
                        "button": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "subtitle": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "heading": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "button": ["15px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
            color: #111c2d;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-field {
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
        }
        .step-active {
            width: 2rem;
            background-color: #004d99;
        }
        .step-inactive {
            width: 0.5rem;
            background-color: #d8e3fb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 shadow-sm bg-surface flex justify-between items-center px-md py-sm">
<div class="flex items-center gap-sm">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">grid_view</span>
</button>
<h1 class="font-display text-display text-primary tracking-tight">LUNAS</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-md">
<div class="w-full max-w-md bg-surface-container-lowest p-lg rounded-xl shadow-lg border border-outline-variant/30">
<!-- Step Indicator -->
<div class="flex items-center justify-between mb-lg">
<div class="flex gap-1.5">
<div class="h-1.5 rounded-full step-active transition-all duration-300"></div>
<div class="h-1.5 rounded-full step-inactive"></div>
<div class="h-1.5 rounded-full step-inactive"></div>
<div class="h-1.5 rounded-full step-inactive"></div>
</div>
<span class="font-caption text-caption text-on-surface-variant">Step 1 of 4</span>
</div>
<!-- Title -->
<div class="mb-lg">
<h2 class="font-heading text-heading text-on-surface">Create Citizen Account</h2>
<p class="font-body text-body text-on-surface-variant mt-xs">Please provide your personal information to begin registration.</p>
</div>
<!-- Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Name Row -->
<div class="space-y-md">
<div class="relative group">
<label class="block font-caption text-caption text-primary mb-1 ml-1">First Name</label>
<div class="flex items-center bg-surface-container-low border-b-2 border-outline hover:border-primary focus-within:border-primary transition-colors filled-field px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body text-body text-on-surface placeholder:text-outline p-0" placeholder="John" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block font-caption text-caption text-on-surface-variant mb-1 ml-1">Middle Name (Optional)</label>
<div class="flex items-center bg-surface-container-low border-b-2 border-outline hover:border-primary focus-within:border-primary transition-colors filled-field px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body text-body text-on-surface placeholder:text-outline p-0" placeholder="Quincy" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block font-caption text-caption text-on-surface-variant mb-1 ml-1">Last Name</label>
<div class="flex items-center bg-surface-container-low border-b-2 border-outline hover:border-primary focus-within:border-primary transition-colors filled-field px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body text-body text-on-surface placeholder:text-outline p-0" placeholder="Doe" type="text"/>
</div>
</div>
</div>
<!-- Date of Birth -->
<div class="relative group">
<label class="block font-caption text-caption text-on-surface-variant mb-1 ml-1">Date of Birth</label>
<div class="flex items-center bg-surface-container-low border-b-2 border-outline hover:border-primary focus-within:border-primary transition-colors filled-field px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body text-body text-on-surface placeholder:text-outline p-0" type="date"/>
</div>
</div>
<!-- Barangay Dropdown -->
<div class="relative" id="barangay-dropdown-container">
<label class="block font-caption text-caption text-on-surface-variant mb-1 ml-1">Barangay (Dagupan City)</label>
<div class="flex items-center bg-surface-container-low border-b-2 border-outline hover:border-primary focus-within:border-primary transition-colors filled-field px-md py-sm cursor-text" onclick="toggleDropdown()">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">location_on</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body text-body text-on-surface placeholder:text-outline p-0" id="barangay-search" placeholder="Search Barangay..." type="text"/>
<span class="material-symbols-outlined text-on-surface-variant ml-sm">expand_more</span>
</div>
<!-- Searchable Results -->
<div class="hidden absolute z-10 w-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-xl max-h-48 overflow-y-auto" id="barangay-list">
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Bonuan Boquig')">Bonuan Boquig</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Bonuan Gueset')">Bonuan Gueset</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Caranglaan')">Caranglaan</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Lucao')">Lucao</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Malued')">Malued</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Mayombo')">Mayombo</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Pantal')">Pantal</div>
<div class="p-2 hover:bg-surface-variant cursor-pointer font-body text-body text-on-surface" onclick="selectBarangay('Tapuac')">Tapuac</div>
</div>
</div>
<!-- Actions -->
<div class="pt-lg flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-button text-button shadow-md hover:brightness-110 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                        Continue
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<a class="w-full text-center text-primary font-button text-button hover:underline" href="#">
                        Back
                    </a>
</div>
</form>
</div>
</main>
<!-- App Decorative Background Overlay -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full"></div>
</div>
<script>
        function toggleDropdown() {
            const list = document.getElementById('barangay-list');
            list.classList.toggle('hidden');
        }

        function selectBarangay(name) {
            const input = document.getElementById('barangay-search');
            input.value = name;
            document.getElementById('barangay-list').classList.add('hidden');
        }

        // Simple search logic
        document.getElementById('barangay-search').addEventListener('input', function(e) {
            const list = document.getElementById('barangay-list');
            list.classList.remove('hidden');
            const filter = e.target.value.toUpperCase();
            const items = list.getElementsByTagName('div');
            for (let i = 0; i < items.length; i++) {
                const textValue = items[i].textContent || items[i].innerText;
                if (textValue.toUpperCase().indexOf(filter) > -1) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const container = document.getElementById('barangay-dropdown-container');
            const list = document.getElementById('barangay-list');
            if (!container.contains(event.target)) {
                list.classList.add('hidden');
            }
        });
    </script>
</body></html>
