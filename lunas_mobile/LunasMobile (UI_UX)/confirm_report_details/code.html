<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex flex-col justify-end p-md">

<span class="bg-error text-on-error font-caption text-caption px-2 py-1 rounded-full uppercase tracking-wider font-semibold">High Severity</span>
</div>

</div>
</section>

<span class="material-symbols-outlined" data-icon="description">description</span>
<h3 class="font-subtitle text-subtitle text-on-surface">Description</h3>
</div>
<p class="font-body text-body text-on-surface-variant">Deep pothole near intersection.</p>
</div>
<!-- Location Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/30 flex flex-col gap-sm">
<div class="flex items-center gap-sm text-primary">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
<h3 class="font-subtitle text-subtitle text-on-surface">Location</h3>
</div>
<div>
<p class="font-body text-body text-on-surface">890 Market Street</p>

<span class="material-symbols-outlined" data-icon="info">info</span>

<ul class="flex flex-col gap-xs">
<li class="flex justify-between items-center py-xs border-b border-surface-variant">
<span class="font-body text-body text-on-surface-variant">Category</span>

</li>

                            </span>
</li>
