events {}

http {
  upstream lunas_backend {
    # The EC2 host publishes the backend only on loopback. Nginx is the
    # public entry point; MongoDB and the backend port remain private.
    server 127.0.0.1:5000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Mobile and non-browser API clients use the same versioned endpoint.
    location /api/v1/ {
      proxy_pass http://lunas_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://lunas_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Netlify owns the public web application. Do not fall through to an EC2
    # web container or accidentally expose an old deployment.
    location / {
      return 404;
    }
  }
}
