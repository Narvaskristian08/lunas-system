<!DOCTYPE html>

<html lang="en"><head>

<title>Assign Utility Provider - LUNAS Engineering</title>

<style>
        body { font-family: 'Inter', sans-serif; }
        .modal-overlay { backdrop-filter: blur(4px); }
        
        /* Custom Scrollbar for list */
        .provider-list::-webkit-scrollbar {
            width: 6px;
        }
        .provider-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .provider-list::-webkit-scrollbar-thumb {
            background-color: #c2c6d4;
            border-radius: 10px;
        }
        
        /* Provider Card Radio Hack */
        input[type="radio"]:checked + .provider-card {
            background-color: #f0f3ff; /* surface-container-low */
            border-color: #004d99; /* primary */
        }
        input[type="radio"]:checked + .provider-card .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center font-body text-body p-4 md:p-8">
<!-- Modal Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/40 modal-overlay z-40 transition-opacity"></div>
<!-- Modal Container (Level 3 Elevation) -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0_10px_20px_rgba(0,0,0,0.12)] w-full max-w-2xl max-h-[795px] flex flex-col z-50 relative overflow-hidden flex-shrink-0 animate-[fade-in-up_0.3s_ease-out]">
<!-- Header -->
<header class="px-lg pt-lg pb-md border-b border-outline-variant/30 flex justify-between items-start shrink-0">
<div>
<h2 class="font-heading text-heading text-on-surface mb-xs">Assign Utility Provider</h2>
<div class="flex items-center gap-2 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[18px]" data-icon="report">report</span>
<span class="font-subtitle text-subtitle text-sm">Incident #INC-2024-8902 • Open Trench</span>
</div>
</div>
<button aria-label="Close modal" class="p-2 rounded-full hover:bg-surface-variant text-on-surface-variant transition-colors">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Content Body (Scrollable) -->
<main class="flex-1 overflow-y-auto p-lg provider-list flex flex-col gap-lg">
<!-- Provider Selection Section -->
<section>
<h3 class="font-title text-title text-on-surface mb-md">Select Provider</h3>
<div class="flex flex-col gap-sm">
<!-- Provider 1: Meralco -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="provider" type="radio" value="meralco"/>
<div class="provider-card border border-outline-variant/50 rounded-xl p-md flex items-center gap-md transition-all hover:bg-surface-container-highest/30">
<!-- Provider Logo Placeholder -->
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-[28px]" data-icon="bolt">bolt</span>
</div>
<!-- Info -->
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-xs">
<h4 class="font-subtitle text-subtitle text-on-surface truncate">Meralco</h4>
<span class="bg-secondary-container text-on-secondary-container px-2 py-[2px] rounded-full font-caption text-caption whitespace-nowrap">Available</span>
</div>
<p class="text-on-surface-variant text-sm truncate">Electricity • Est. Response: 45 mins</p>
</div>
<!-- Status Indicator -->
<div class="flex items-center gap-2 text-primary shrink-0">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] opacity-0 scale-50 transition-all check-icon" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</label>
<!-- Provider 2: Maynilad -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="provider" type="radio" value="maynilad"/>
<div class="provider-card border border-outline-variant/50 rounded-xl p-md flex items-center gap-md transition-all hover:bg-surface-container-highest/30">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span aria-hidden="true" class="material-symbols-outlined text-[#0ea5e9] text-[28px]" data-icon="water_drop">water_drop</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-xs">
<h4 class="font-subtitle text-subtitle text-on-surface truncate">Maynilad</h4>
<span class="bg-secondary-container text-on-secondary-container px-2 py-[2px] rounded-full font-caption text-caption whitespace-nowrap">Available</span>
</div>
<p class="text-on-surface-variant text-sm truncate">Water • Est. Response: 1 hr 15 mins</p>
</div>
<div class="flex items-center gap-2 text-primary shrink-0">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] opacity-0 scale-50 transition-all check-icon" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</label>
<!-- Provider 3: PLDT (Busy) -->
<label class="relative cursor-pointer group opacity-75">
<input class="peer sr-only" name="provider" type="radio" value="pldt"/>
<div class="provider-card border border-outline-variant/50 rounded-xl p-md flex items-center gap-md transition-all hover:bg-surface-container-highest/30">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span aria-hidden="true" class="material-symbols-outlined text-[#f59e0b] text-[28px]" data-icon="router">router</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-xs">
<h4 class="font-subtitle text-subtitle text-on-surface truncate">PLDT</h4>
<span class="bg-surface-variant text-on-surface-variant px-2 py-[2px] rounded-full font-caption text-caption whitespace-nowrap">High Volume</span>
</div>
<p class="text-on-surface-variant text-sm truncate">Telecom • Est. Response: 3+ hrs</p>
</div>
<div class="flex items-center gap-2 text-primary shrink-0">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] opacity-0 scale-50 transition-all check-icon" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</label>
</div>
</section>
<!-- Instructions Section -->
<section class="mt-2">
<label class="block font-subtitle text-subtitle text-on-surface mb-sm" for="dispatch_instructions">Dispatch Instructions</label>
<div class="relative">
<span aria-hidden="true" class="absolute left-md top-3 material-symbols-outlined text-on-surface-variant" data-icon="edit_note">edit_note</span>
<textarea class="w-full bg-surface-container rounded-t-[14px] border-b-2 border-outline-variant focus:border-primary focus:ring-0 pl-11 pr-md py-3 text-on-surface placeholder:text-on-surface-variant resize-none transition-colors" id="dispatch_instructions" placeholder="Add specific details, site access codes, or hazards..." rows="3"></textarea>
</div>
</section>
</main>
<!-- Footer Actions -->
<footer class="p-lg border-t border-outline-variant/30 bg-surface flex justify-end gap-sm shrink-0 rounded-b-[24px]">
<button class="px-6 py-2 rounded-full font-button text-button text-primary hover:bg-surface-variant transition-colors" type="button">
                Cancel
            </button>
<button class="px-6 py-2 rounded-full bg-primary text-on-primary font-button text-button hover:bg-primary/90 transition-colors shadow-sm flex items-center gap-2" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[18px]" data-icon="send">send</span>
                Assign Provider
            </button>
</footer>
</div>
</body></html>
