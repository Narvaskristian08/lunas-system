events {}

http {
  upstream lunas_backend {
    server backend:5000;
  }

  upstream lunas_web {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Mobile and non-browser API clients use the same versioned endpoint.
    location /api/v1/ {
      proxy_pass http://lunas_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://lunas_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://lunas_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
