<!-- Interactive Layer for micro-shadows -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const containers = document.querySelectorAll('.glass-effect');
            containers.forEach(container => {
                const moveX = (x - 0.5) * 20;
                const moveY = (y - 0.5) * 20;
                container.style.boxShadow = `${moveX}px ${moveY}px 40px rgba(0, 77, 153, 0.05)`;
            });
        });

        // Suppression Logic Check (As per System Prompt: Hide Shell on Welcome/Transactional screens)
        // Since this is a Welcome screen, we are deliberately not rendering the BottomNavBar or SideNav 
        // to maintain task focus and linear journey priority.
    </script>
